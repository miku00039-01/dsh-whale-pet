name: Build & Release

# 显式声明写权限:创建 Release 需要 GITHUB_TOKEN 的 contents: write
# (仓库默认只读时,不加这一行 release 步骤会失败)
permissions:
  contents: write

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with build.ps1
        shell: pwsh
        run: |
          ./build.ps1
          # Release 资产用 ASCII 文件名,避免中文名在跨系统传输时被截断
          Move-Item -Force DSH桌宠.exe DSHWhalePet.exe

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSHWhalePet-exe
          path: DSHWhalePet.exe
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Release 正文取自 CHANGELOG.md 中与该 tag 对应的版本小节(含"改了什么 + 为什么"),
      # 不再依赖 GitHub 自动生成的提交列表:直接往 master 提交时,自动说明往往只剩一个 compare 链接。
      - name: Extract changelog section for this tag
        shell: bash
        run: bash .github/scripts/extract-changelog.sh "$GITHUB_REF_NAME" CHANGELOG.md RELEASE_BODY.md

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: DSHWhalePet-exe
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DSHWhalePet.exe
          body_path: RELEASE_BODY.md
