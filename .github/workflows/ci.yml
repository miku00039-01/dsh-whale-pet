name: Build & Release

# 显式声明写权限:创建 Release 需要 GITHUB_TOKEN 的 contents: write
# (仓库默认只读时,不加这一行 release 步骤会失败)
permissions:
  contents: write

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with build.ps1
        shell: pwsh
        run: ./build.ps1

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSHWhalePet-exe
          path: DSH桌宠.exe
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: DSHWhalePet-exe
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DSH桌宠.exe
          generate_release_notes: true
